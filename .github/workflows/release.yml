name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  VERSION: ${{ github.ref_name }}

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ── Desktop (Wails) builds ───────────────────────────────────
          - runner: windows-latest
            goos: windows
            goarch: amd64
            desktop: true
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            desktop: true
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            desktop: true
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            desktop: true   # will fall back to headless (no GUI on runner)

          # ── Headless builds (cross-compile) ──────────────────────────
          - runner: ubuntu-latest
            goos: windows
            goarch: amd64
            desktop: false
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            desktop: false
          - runner: ubuntu-latest
            goos: linux
            goarch: arm64
            desktop: false
          - runner: macos-latest
            goos: darwin
            goarch: amd64
            desktop: false
          - runner: macos-latest
            goos: darwin
            goarch: arm64
            desktop: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Read the version from go.mod so the toolchain can never drift from
      # what the module actually requires.
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Resolve build metadata
        id: meta
        shell: bash
        run: |
          VER="${VERSION#v}"
          VER="${VER:-$(git rev-parse --short HEAD)}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILDTIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          echo "ver=$VER" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          echo "builddate=$BUILDTIME" >> "$GITHUB_OUTPUT"
          if [ "${{ matrix.desktop }}" = "true" ] && [ "${{ matrix.runner }}" != "ubuntu-latest" ]; then
            echo "buildtype=desktop" >> "$GITHUB_OUTPUT"
          elif [ "${{ matrix.desktop }}" = "true" ]; then
            echo "buildtype=skip" >> "$GITHUB_OUTPUT"
          else
            echo "buildtype=headless" >> "$GITHUB_OUTPUT"
          fi
          echo "ldflags=-s -w -X github.com/local/relayhub/internal/version.Version=$VER -X github.com/local/relayhub/internal/version.Commit=$COMMIT -X github.com/local/relayhub/internal/version.BuildTime=$BUILDTIME" >> "$GITHUB_OUTPUT"

      # Wails v2.15.0's darwin frontend references UTType without linking the
      # framework that defines it. Recent macOS SDKs no longer pull it in
      # implicitly, so the link fails with an undefined _OBJC_CLASS_$_UTType.
      # Supply it here until the dependency is upgraded.
      - name: Set macOS link flags
        if: matrix.desktop && matrix.goos == 'darwin'
        run: echo "CGO_LDFLAGS=-framework UniformTypeIdentifiers" >> "$GITHUB_ENV"

      # ── Desktop (Wails) build ────────────────────────────────────────
      # Install the Wails CLI *natively* for the runner host: the GOOS/GOARCH
      # env below targets the app build, and leaking it into `go install`
      # cross-compiles the CLI itself (e.g. amd64 on an arm64 macos runner),
      # which then cannot run and fails with "wails: command not found".
      - name: Build desktop (Wails)
        if: matrix.desktop && matrix.runner != 'ubuntu-latest'
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        shell: bash
        run: |
          GOOS= GOARCH= CGO_ENABLED=0 \
            go install github.com/wailsapp/wails/v2/cmd/wails@v2.15.0
          export PATH="$(go env GOPATH)/bin:$PATH"
          if ! command -v wails >/dev/null; then
            echo "::error::wails CLI not found after go install"
            ls -la "$(go env GOPATH)/bin" || true
            exit 1
          fi
          wails build -platform "$GOOS/$GOARCH" \
            -ldflags "${{ steps.meta.outputs.ldflags }}" \
            -o "RelayHub-${GOOS}-${GOARCH}"

          # Wails v2 ignores -o and always writes under build/bin/ (bare exe
          # on Windows, .app bundle on macOS). Normalize the artifact to the
          # repo root under a stable name so the upload step can find it.
          case "$GOOS" in
            windows)
              BIN="$(ls build/bin/RelayHub-windows-${GOARCH}* 2>/dev/null | head -1)"
              if [ -z "$BIN" ]; then
                echo "::error::expected build/bin/RelayHub-windows-${GOARCH}*"
                ls -la build/bin
                exit 1
              fi
              cp "$BIN" "RelayHub-windows-${GOARCH}.exe"
              ;;
            darwin)
              if [ ! -d build/bin/RelayHub.app ]; then
                echo "::error::expected build/bin/RelayHub.app"
                ls -la build/bin
                exit 1
              fi
              ditto -c -k --sequesterRsrc --keepParent \
                build/bin/RelayHub.app "RelayHub-darwin-${GOARCH}.app.zip"
              ;;
          esac
          ls -la

      # ── Linux desktop runner has no GUI: skip, headless covers it ───
      - name: Skip desktop on Linux
        if: matrix.desktop && matrix.runner == 'ubuntu-latest'
        run: |
          echo "No GUI on ubuntu runner; Linux desktop is skipped. Headless binary covers linux/amd64."
          exit 0

      # ── Headless build (cross-compile, no GUI deps) ──────────────────
      - name: Build headless
        if: matrix.desktop == false
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        shell: bash
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          # No -H windowsgui here: the headless binary is a console program.
          # Detaching it from the console would hide its log output and stop
          # it from receiving Ctrl+C, which is its whole shutdown path.
          LDFLAGS="${{ steps.meta.outputs.ldflags }}"
          go build -tags=production \
            -ldflags "$LDFLAGS" \
            -o "relayhub-headless-${GOOS}-${GOARCH}${EXT}" \
            ./cmd/headless

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.goos }}-${{ matrix.goarch }}-${{ steps.meta.outputs.buildtype || 'skip' }}
          path: |
            RelayHub-*
            relayhub-headless-*
          if-no-files-found: ${{ matrix.desktop && matrix.runner != 'ubuntu-latest' && 'error' || 'warn' }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      # gh release create --generate-notes derives notes from git history, so
      # it needs a repository (full history for meaningful notes).
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/**/* \
            --title "${GITHUB_REF_NAME}" \
            --generate-notes
